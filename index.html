<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Music Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css"
    integrity="sha384-AYmEC3Yw5cVb3ZcuHtOA93w35dYTsvhLPVnYs9eStHfGJvOvKxVfELGroGkvsg+p" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="main_div">
    <div class="music_container">
      <!-- Removed search bar -->
      
      <marquee>
        <h2 id="title">Hasi (Cover Version)</h2>
      </marquee>

      <h3 id="artist">Shebika Pal</h3>

      <div class="img_container">
        <img src="IMG-20230920-002937.jpg" alt="thumbnail">
      </div>

      <audio preload="auto" onended="nextSong()" onpause="pauseMusic()" src="music/default.mp3"></audio>
<!-- ========== PROGRESS BAR SECTION ========== -->
      <div class="progress_container">
        <div class="progress_bar">
          <input type="range" id="progressRange" min="0" max="100" value="0" step="0.1">
          <div class="progress_fill" id="progressFill"></div>
        </div>
        <div class="time_display">
          <span id="currentTime">0:00</span>
          <span id="totalTime">0:00</span>
        </div>
      </div>
      <div class="controls">
        <i class="fas fa-repeat"></i>
        <select id="sleepbtn" onchange="gotoSleep()">
          <option value="0">Sleep</option>
          <option value="5">5min</option>
          <option value="15">15min</option>
          <option value="30">30min</option>
          <option value="60">60min</option>
          <option value="90">90min</option>
        </select>
        <i class="fas fa-random"></i>
      </div>
      <div class="music_controls">
        <i onclick="prevSong()" class="fas fa-backward" id="previous" title="Previous"></i>
        <i class="fas fa-play main_button" id="play" title="Play"></i>
        <i onclick="nextSong()" class="fas fa-forward" id="next" title="Next"></i>
      </div>
      
      <!-- Add Playlist Section -->
      <div class="playlist_container">
        <h4 style="color: #f6f6f6; margin: 15px 0 10px 0;">🎵 Playlist</h4>
        <ul id="playlist" style="list-style: none; padding: 0; max-height: 200px; overflow-y: auto;">
          <!-- Songs will be dynamically added here -->
        </ul>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
